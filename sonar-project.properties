# ==============================================================================
# SonarQube Scanner Configuration - Frontend (Angular 22)
# Lenguaje de Programación II · Ciclo IV · Semestre 2026-2
# Entregable E13 · Informe de calidad del código con SonarQube
# ==============================================================================

sonar.projectKey=grupo-frontend
sonar.projectName=grupo-frontend
sonar.projectVersion=1.1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

# Reporte de cobertura LCOV generado con Vitest
sonar.javascript.lcov.reportPaths=coverage/geovisionFrontEnd/lcov.info

# Exclusiones de cobertura según la plantilla institucional (main.ts, environments, routes)
sonar.coverage.exclusions=src/main.ts,src/environments/**,**/*.routes.ts,public/**
sonar.exclusions=node_modules/**,dist/**,coverage/**,**/*.spec.ts
